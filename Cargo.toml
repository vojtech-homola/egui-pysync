[workspace]
members = [
    "crates/egui-states",
    "crates/egui-states-macros",
    "crates/egui-states-python",

    "example/showcase/gui-core",
    "example/showcase/gui",
    "example/showcase/rust",
    "example/counter/gui",
    "example/counter/rust",
    "tests/schema",
    "tests/support",
    "tests/example-support"
]
resolver = "3"

[workspace.package]
version = "0.16.0"
edition = "2024"

[workspace.dependencies]
egui_states_macros = { path = "crates/egui-states-macros" }
egui_states = { path = "crates/egui-states" }
